[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sequential-recommendation-benchmark"
version = "0.1.0"
requires-python = ">=3.10,<3.12"
dependencies = ["numpy>=1.24", "pandas>=2", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7", "PyYAML>=6", "tqdm>=4", "pyarrow>=12"]

[project.optional-dependencies]
neural = ["torch>=2.2"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["cuda: requires a CUDA device and checks GPU execution"]
